version: '3.8'

services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: trustlane-timescaledb
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: trustlane
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d trustlane"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - trustlane-network

  trustlane-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trustlane-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      PGHOST: timescaledb
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: trustlane
      DATABASE_URL: postgres://postgres:postgres@timescaledb:5432/trustlane
      TRUSTLANE_SECRET: ${TRUSTLANE_SECRET:-trustlane_sec_npci_grade_2026_x99}
      GATE_TICKET_SECRET: ${GATE_TICKET_SECRET:-gate_sig_secret_key_8832_trustlane}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    depends_on:
      timescaledb:
        condition: service_healthy
    volumes:
      - app_data:/app/.data
    networks:
      - trustlane-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => {if (r.statusCode !== 200) throw new Error(r.statusCode)})"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  timescaledb_data:
    driver: local
  app_data:
    driver: local

networks:
  trustlane-network:
    driver: bridge
